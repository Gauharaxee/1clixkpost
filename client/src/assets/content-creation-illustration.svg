<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="800" height="600" fill="#f9fafb" />
  
  <!-- Content Creation Workspace -->
  <rect x="50" y="50" width="700" height="500" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" />
  
  <!-- Header -->
  <rect x="50" y="50" width="700" height="60" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" />
  <text x="85" y="85" font-family="Arial" font-size="20" font-weight="bold" fill="#111827">Create New Post</text>
  
  <!-- Content Editor -->
  <rect x="70" y="130" width="660" height="200" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" />
  
  <!-- Editor Toolbar -->
  <rect x="70" y="130" width="660" height="40" rx="8" fill="#f3f4f6" />
  
  <!-- Toolbar Buttons -->
  <circle cx="100" cy="150" r="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1" />
  <text x="100" y="155" font-family="Arial" font-size="14" text-anchor="middle" fill="#4b5563" font-weight="bold">B</text>
  
  <circle cx="130" cy="150" r="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1" />
  <text x="130" y="155" font-family="Arial" font-size="14" text-anchor="middle" fill="#4b5563" font-style="italic">I</text>
  
  <circle cx="160" cy="150" r="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1" />
  <text x="160" y="155" font-family="Arial" font-size="14" text-anchor="middle" fill="#4b5563" text-decoration="underline">U</text>
  
  <rect x="190" y="138" width="1" height="24" fill="#d1d5db" />
  
  <circle cx="220" cy="150" r="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1" />
  <line x1="213" y1="150" x2="227" y2="150" stroke="#4b5563" stroke-width="2" />
  <line x1="220" y1="143" x2="220" y2="157" stroke="#4b5563" stroke-width="2" />
  
  <circle cx="250" cy="150" r="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1" />
  <rect x="243" y="146" width="14" height="8" fill="#4b5563" />
  
  <rect x="280" y="138" width="1" height="24" fill="#d1d5db" />
  
  <circle cx="310" cy="150" r="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1" />
  <circle cx="310" cy="150" r="6" fill="#4b5563" />
  
  <!-- Editor Content Area -->
  <text x="100" y="200" font-family="Arial" font-size="16" fill="#9ca3af">What would you like to share?</text>
  <line x1="100" y1="210" x2="400" y2="210" stroke="#4b5563" stroke-width="2" />
  
  <!-- Image Preview -->
  <rect x="100" y="230" width="240" height="80" rx="4" fill="#f3f4f6" />
  <rect x="130" y="245" width="180" height="50" rx="4" fill="#e5e7eb" />
  <circle cx="160" cy="270" r="12" fill="#9ca3af" />
  <line x1="180" y1="260" x2="250" y2="260" stroke="#9ca3af" stroke-width="2" />
  <line x1="180" y1="270" x2="240" y2="270" stroke="#9ca3af" stroke-width="2" />
  <line x1="180" y1="280" x2="230" y2="280" stroke="#9ca3af" stroke-width="2" />
  
  <!-- Platform Selection -->
  <rect x="70" y="350" width="660" height="80" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" />
  <text x="100" y="380" font-family="Arial" font-size="16" fill="#111827">Post to:</text>
  
  <!-- Platform Buttons -->
  <circle cx="200" cy="380" r="20" fill="#ffffff" stroke="#1877f2" stroke-width="2" />
  <text x="200" y="386" font-family="Arial" font-size="18" text-anchor="middle" fill="#1877f2" font-weight="bold">f</text>
  
  <circle cx="250" cy="380" r="20" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="250" y="386" font-family="Arial" font-size="18" text-anchor="middle" fill="#000000">𝕏</text>
  
  <circle cx="300" cy="380" r="20" fill="#ffffff" stroke="#0a66c2" stroke-width="2" />
  <text x="300" y="386" font-family="Arial" font-size="18" text-anchor="middle" fill="#0a66c2">in</text>
  
  <circle cx="350" cy="380" r="20" fill="#ffffff" stroke="#ea4335" stroke-width="2" />
  <text x="350" y="386" font-family="Arial" font-size="18" text-anchor="middle" fill="#ea4335">G</text>
  
  <!-- Schedule Option -->
  <rect x="450" y="365" width="120" height="30" rx="15" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1" />
  <text x="495" y="385" font-family="Arial" font-size="14" text-anchor="middle" fill="#4b5563">Schedule</text>
  <circle cx="465" cy="380" r="8" fill="#4b5563" />
  
  <!-- Publish Button -->
  <rect x="600" y="365" width="110" height="30" rx="6" fill="#3b82f6" />
  <text x="655" y="385" font-family="Arial" font-size="14" text-anchor="middle" fill="#ffffff">Publish Now</text>
  
  <!-- Preview Section -->
  <rect x="70" y="450" width="660" height="80" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" />
  <text x="100" y="480" font-family="Arial" font-size="16" font-weight="bold" fill="#111827">Preview:</text>
  
  <!-- Preview Tabs -->
  <rect x="180" y="465" width="100" height="30" rx="6" fill="#1877f2" />
  <text x="230" y="485" font-family="Arial" font-size="14" text-anchor="middle" fill="#ffffff">Meta</text>
  
  <rect x="290" y="465" width="100" height="30" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1" />
  <text x="340" y="485" font-family="Arial" font-size="14" text-anchor="middle" fill="#4b5563">X</text>
  
  <rect x="400" y="465" width="100" height="30" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1" />
  <text x="450" y="485" font-family="Arial" font-size="14" text-anchor="middle" fill="#4b5563">LinkedIn</text>
  
  <rect x="510" y="465" width="100" height="30" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1" />
  <text x="560" y="485" font-family="Arial" font-size="14" text-anchor="middle" fill="#4b5563">Google</text>
  
  <!-- Loading Indicator -->
  <circle cx="730" cy="88" r="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2" stroke-dasharray="50 20" />
</svg>
