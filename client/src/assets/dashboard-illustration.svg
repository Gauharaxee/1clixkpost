<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="800" height="600" fill="#f9fafb" />
  
  <!-- Dashboard Frame -->
  <rect x="50" y="50" width="700" height="500" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" />
  
  <!-- Header -->
  <rect x="50" y="50" width="700" height="60" rx="10" fill="#3b82f6" />
  <text x="85" y="85" font-family="Arial" font-size="20" font-weight="bold" fill="#ffffff">Social Media Dashboard</text>
  
  <!-- Sidebar -->
  <rect x="50" y="110" width="150" height="440" fill="#f3f4f6" />
  
  <!-- Sidebar Menu Items -->
  <rect x="65" y="140" width="120" height="40" rx="5" fill="#3b82f6" />
  <text x="95" y="165" font-family="Arial" font-size="14" fill="#ffffff">Dashboard</text>
  
  <rect x="65" y="190" width="120" height="40" rx="5" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
  <text x="95" y="215" font-family="Arial" font-size="14" fill="#4b5563">Create Post</text>
  
  <rect x="65" y="240" width="120" height="40" rx="5" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
  <text x="95" y="265" font-family="Arial" font-size="14" fill="#4b5563">Scheduled</text>
  
  <rect x="65" y="290" width="120" height="40" rx="5" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
  <text x="95" y="315" font-family="Arial" font-size="14" fill="#4b5563">Analytics</text>
  
  <!-- Main Content -->
  <rect x="220" y="130" width="510" height="150" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" />
  <text x="240" y="160" font-family="Arial" font-size="16" font-weight="bold" fill="#111827">Performance Overview</text>
  
  <!-- Chart -->
  <line x1="240" y1="250" x2="700" y2="250" stroke="#e5e7eb" stroke-width="1" />
  <line x1="240" y1="210" x2="240" y2="250" stroke="#e5e7eb" stroke-width="1" />
  
  <!-- Chart Lines -->
  <path d="M240,230 C300,210 350,240 400,200 C450,180 500,220 550,190 C600,200 650,180 700,210" stroke="#3b82f6" stroke-width="3" fill="none" />
  <path d="M240,240 C300,230 350,220 400,230 C450,210 500,230 550,220 C600,230 650,210 700,220" stroke="#10b981" stroke-width="3" fill="none" />
  
  <!-- Stat Cards -->
  <rect x="220" y="300" width="240" height="120" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" />
  <text x="240" y="330" font-family="Arial" font-size="16" font-weight="bold" fill="#111827">Total Engagement</text>
  <text x="240" y="370" font-family="Arial" font-size="30" font-weight="bold" fill="#3b82f6">12.5K</text>
  <text x="240" y="400" font-family="Arial" font-size="14" fill="#6b7280">Last 30 days</text>
  
  <rect x="490" y="300" width="240" height="120" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" />
  <text x="510" y="330" font-family="Arial" font-size="16" font-weight="bold" fill="#111827">Impressions</text>
  <text x="510" y="370" font-family="Arial" font-size="30" font-weight="bold" fill="#10b981">48.2K</text>
  <text x="510" y="400" font-family="Arial" font-size="14" fill="#6b7280">Last 30 days</text>
  
  <!-- Platform Icons -->
  <circle cx="250" cy="470" r="25" fill="#1877f2" />
  <text x="250" y="477" font-family="Arial" font-size="20" text-anchor="middle" fill="#ffffff">f</text>
  
  <circle cx="320" cy="470" r="25" fill="#000000" />
  <text x="320" y="477" font-family="Arial" font-size="20" text-anchor="middle" fill="#ffffff">𝕏</text>
  
  <circle cx="390" cy="470" r="25" fill="#0a66c2" />
  <text x="390" y="477" font-family="Arial" font-size="20" text-anchor="middle" fill="#ffffff">in</text>
  
  <circle cx="460" cy="470" r="25" fill="#ea4335" />
  <text x="460" y="477" font-family="Arial" font-size="20" text-anchor="middle" fill="#ffffff">G</text>
  
  <!-- Data Points -->
  <circle cx="240" cy="230" r="4" fill="#3b82f6" />
  <circle cx="300" cy="210" r="4" fill="#3b82f6" />
  <circle cx="350" cy="240" r="4" fill="#3b82f6" />
  <circle cx="400" cy="200" r="4" fill="#3b82f6" />
  <circle cx="450" cy="180" r="4" fill="#3b82f6" />
  <circle cx="500" cy="220" r="4" fill="#3b82f6" />
  <circle cx="550" cy="190" r="4" fill="#3b82f6" />
  <circle cx="600" cy="200" r="4" fill="#3b82f6" />
  <circle cx="650" cy="180" r="4" fill="#3b82f6" />
  <circle cx="700" cy="210" r="4" fill="#3b82f6" />
  
  <circle cx="240" cy="240" r="4" fill="#10b981" />
  <circle cx="300" cy="230" r="4" fill="#10b981" />
  <circle cx="350" cy="220" r="4" fill="#10b981" />
  <circle cx="400" cy="230" r="4" fill="#10b981" />
  <circle cx="450" cy="210" r="4" fill="#10b981" />
  <circle cx="500" cy="230" r="4" fill="#10b981" />
  <circle cx="550" cy="220" r="4" fill="#10b981" />
  <circle cx="600" cy="230" r="4" fill="#10b981" />
  <circle cx="650" cy="210" r="4" fill="#10b981" />
  <circle cx="700" cy="220" r="4" fill="#10b981" />
</svg>
